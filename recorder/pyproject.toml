# Modified 2026-10-20: public capture-only cut, no rule matching or runtime dependencies.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signwarden-recorder"
version = "0.1.0"
description = "Local tool-call capture and SHA-256 chain verification for Claude Code"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "SignWarden Authors"}]
dependencies = []

[project.scripts]
swr = "signwarden_recorder.cli:main"
signwarden-recorder = "signwarden_recorder.cli:main"

[tool.setuptools.packages.find]
include = ["signwarden_recorder*"]

[tool.setuptools.package-data]
signwarden_recorder = ["client.c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
