[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "truquence"
version = "0.2.0"
description = "Offline workflow execution acceptance and supplied-record reconciliation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Truquence Team", email = "hello@truquence.com"}]
dependencies = []

[project.scripts]
truquence = "truquence.entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
truquence = ["web/*.html", "web/*.js", "web/*.css", "samples/*.csv", "SCHEMA.json", "EXPECTED.json"]
actioncontract = ["schema/*.json", "contracts/*.json", "samples/*.json"]
