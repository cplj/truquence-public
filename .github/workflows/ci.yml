name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -W error -m compileall -q .
      - run: python -m pip install "build==1.3.0" "setuptools==83.0.0" "wheel==0.46.2" "mcp==1.30.0" "hypothesis==6.168.5" "tomli==2.5.0"
      - run: python -m build --no-isolation
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m unittest discover -s tests/product -v
      - run: python -m unittest discover -s tests/actioncontract -v
      - run: python -m unittest discover -s tests/recorder -v
      - run: python -m unittest discover -s tests/integration -v
