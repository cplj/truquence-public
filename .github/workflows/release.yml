name: Publish Python package
on:
  release:
    types: [published]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "pip==26.2.1" "build==1.3.0" "setuptools==83.0.0" "wheel==0.46.2" "packaging==25.0" "pyproject-hooks==1.2.0" "mcp==1.30.0" "hypothesis==6.168.5" "tomli==2.5.0"
      - run: python -m build --no-isolation
      - run: python -m pip install --no-deps dist/*.whl
      - run: python -m unittest discover -s tests/product -v
      - run: python -m unittest discover -s tests/actioncontract -v
      - run: python -m unittest discover -s tests/recorder -v
      - run: python -m unittest discover -s tests/integration -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: python-distributions
          path: dist/
        if: matrix.python-version == '3.14'
  publish:
    needs: build
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
  provenance:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-distributions
          path: dist/
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        id: attest
        with:
          subject-path: 'dist/*'
      - name: Attach distributions and provenance bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE" "provenance-$TAG.sigstore.json"
          gh release upload --clobber "$TAG" dist/* "provenance-$TAG.sigstore.json"
